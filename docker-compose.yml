services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_pass}
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking_user} -d ${POSTGRES_DB:-booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - booking_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking_user}:${POSTGRES_PASSWORD:-booking_pass}@postgres:5432/${POSTGRES_DB:-booking_db}
      REDIS_URL: redis://redis:6379
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change-me-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-change-me-app-secret}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-change-me-access-token}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-123456789012345}
      LLM_API_KEY: ${LLM_API_KEY:-change-me-llm-api-key}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - booking_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking_user}:${POSTGRES_PASSWORD:-booking_pass}@postgres:5432/${POSTGRES_DB:-booking_db}
      REDIS_URL: redis://redis:6379
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change-me-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-change-me-app-secret}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-change-me-access-token}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-123456789012345}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      LLM_API_KEY: ${LLM_API_KEY:-change-me-llm-api-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_TOOL_ITERATIONS: ${LLM_MAX_TOOL_ITERATIONS:-3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-gracitas-admin-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking_user}:${POSTGRES_PASSWORD:-booking_pass}@postgres:5432/${POSTGRES_DB:-booking_db}
      REDIS_URL: redis://redis:6379
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change-me-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-change-me-app-secret}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-change-me-access-token}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-123456789012345}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_TEMPLATE_REMINDER_NAME: ${WHATSAPP_TEMPLATE_REMINDER_NAME:-booking_reminder}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      LLM_API_KEY: ${LLM_API_KEY:-change-me-llm-api-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_TOOL_ITERATIONS: ${LLM_MAX_TOOL_ITERATIONS:-3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-gracitas-admin-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - booking_net

volumes:
  postgres_data:
  redis_data:

networks:
  booking_net:
    driver: bridge
