<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracitas — Panel de Administración</title>
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent: #15803d;
      --accent-hover: #166534;
      --accent-soft: #dcfce7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.45;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input, select, button {
      font: inherit;
      font-size: 16px;
      min-height: 44px;
      border-radius: 8px;
    }

    input, select {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      padding: 0 12px;
      color: var(--text-primary);
    }

    button {
      border: 1px solid transparent;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg-surface); border-color: var(--border); color: var(--text-primary); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }

    @media (hover: hover) and (pointer: fine) {
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-secondary:hover { background: var(--bg-subtle); }
      .btn-danger:hover { background: #fecaca; }
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 20px max(20px, env(safe-area-inset-bottom));
      display: grid;
      gap: 20px;
    }

    .auth-card {
      max-width: 420px;
      margin: 48px auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: grid;
      gap: 14px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .kpi-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .courts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .court-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .court-header {
      padding: 14px 16px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .slot-list {
      display: grid;
    }

    .slot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .slot-row:last-child { border-bottom: none; }

    .slot-meta {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .slot-time { font-weight: 600; }
    .slot-detail {
      font-size: 0.875rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-block;
    }

    .badge-free { background: var(--accent-soft); color: var(--accent); }
    .badge-booked { background: var(--bg-subtle); color: var(--text-primary); }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--danger-soft);
      color: var(--danger);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .skeleton {
      height: 220px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    .empty-state {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    dialog {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: min(440px, calc(100vw - 32px));
    }

    @media (max-width: 640px) {
      dialog {
        margin: auto 0 0 0;
        width: 100%;
        max-width: 100%;
        border-radius: 16px 16px 0 0;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }

    dialog::backdrop { background: rgba(15, 23, 42, 0.45); }

    .form-grid {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .live-pill.online { background: var(--accent-soft); color: var(--accent); }
    .live-pill.online .live-dot { background: var(--accent); }

    .court-summary {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .bar-track {
      height: 8px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <line x1="12" y1="4" x2="12" y2="20" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </span>
        <span>Gracitas Admin</span>
        <span id="livePill" class="live-pill hidden"><span class="live-dot"></span><span id="liveText">Conectando...</span></span>
      </div>
      <div id="topControls" class="controls hidden">
        <input id="dateInput" type="date" aria-label="Fecha" />
        <button id="refreshBtn" class="btn-secondary" type="button">Actualizar</button>
        <button id="newBookingBtn" class="btn-primary" type="button">Nueva reserva</button>
      </div>
    </div>
  </header>

  <main>
    <section id="authSection" class="auth-card">
      <h1 style="margin:0;font-size:1.25rem;">Acceso administrativo</h1>
      <p style="margin:0;color:var(--text-secondary);font-size:0.9rem;">
        Ingresa el token de administración configurado en <code>ADMIN_TOKEN</code>.
      </p>
      <input id="tokenInput" type="password" placeholder="Token de administrador" autocomplete="current-password" />
      <button id="loginBtn" class="btn-primary" type="button">Ingresar</button>
      <div id="authError" class="alert hidden"></div>
    </section>

    <section id="dashboardSection" class="hidden" style="display:grid;gap:20px;">
      <div id="errorBanner" class="alert hidden">
        <span id="errorText"></span>
        <button id="retryBtn" class="btn-secondary" type="button">Reintentar</button>
      </div>

      <div class="kpis">
        <div class="kpi-card">
          <div class="kpi-label">Reservas confirmadas</div>
          <div id="kpiCount" class="kpi-value tabular">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Ocupación del día</div>
          <div id="kpiOccupancy" class="kpi-value tabular">0%</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Ingresos proyectados</div>
          <div id="kpiRevenue" class="kpi-value tabular">S/ 0.00</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Canceladas</div>
          <div id="kpiCancelled" class="kpi-value tabular">0</div>
        </div>
      </div>

      <div id="courtBreakdown" class="court-summary"></div>

      <div id="loadingState" class="courts-grid hidden">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>

      <div id="courtsGrid" class="courts-grid"></div>
    </section>
  </main>

  <dialog id="bookingDialog">
    <form id="bookingForm" method="dialog">
      <h2 style="margin:0;font-size:1.1rem;">Nueva reserva manual</h2>
      <div class="form-grid">
        <select id="modalCourt" required></select>
        <input id="modalStartHour" type="number" min="15" max="22" value="19" required placeholder="Hora inicio (15-22)" />
        <input id="modalDuration" type="number" min="1" max="4" value="1" required placeholder="Horas (1-4)" />
        <input id="modalName" type="text" required minlength="2" maxlength="60" placeholder="Nombre del cliente (máx. 60 caracteres)" />
        <input id="modalPhone" type="tel" required minlength="9" maxlength="15" pattern="[0-9]{9,15}" inputmode="numeric" placeholder="Celular (9 a 15 dígitos, ej. 51999888777)" />
      </div>
      <div id="modalError" class="alert hidden" style="margin-top:10px;"></div>
      <div class="form-actions">
        <button id="closeDialogBtn" class="btn-secondary" type="button">Cancelar</button>
        <button class="btn-primary" type="submit">Confirmar reserva</button>
      </div>
    </form>
  </dialog>

  <script>
    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const topControls = document.getElementById('topControls');
    const dateInput = document.getElementById('dateInput');
    const tokenInput = document.getElementById('tokenInput');
    const authError = document.getElementById('authError');
    const errorBanner = document.getElementById('errorBanner');
    const errorText = document.getElementById('errorText');
    const loadingState = document.getElementById('loadingState');
    const courtsGrid = document.getElementById('courtsGrid');
    const bookingDialog = document.getElementById('bookingDialog');
    const modalCourt = document.getElementById('modalCourt');
    const modalError = document.getElementById('modalError');

    let adminToken = sessionStorage.getItem('gracitas_admin_token') || '';
    let currentResources = [];
    let eventSource = null;
    const livePill = document.getElementById('livePill');
    const liveText = document.getElementById('liveText');

    function connectLiveEvents() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      if (!adminToken) return;
      livePill.classList.remove('hidden');
      livePill.classList.remove('online');
      liveText.textContent = 'Conectando...';

      eventSource = new EventSource(`/admin/api/events?token=${encodeURIComponent(adminToken)}`);
      eventSource.addEventListener('connected', () => {
        livePill.classList.add('online');
        liveText.textContent = 'En vivo';
      });
      eventSource.addEventListener('bookings_updated', () => {
        loadOverview({ silent: true });
      });
      eventSource.onerror = () => {
        livePill.classList.remove('online');
        liveText.textContent = 'Reconectando...';
      };
    }

    function getLimaToday() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Lima',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(new Date());
    }

    dateInput.value = getLimaToday();

    async function apiFetch(url, options = {}) {
      const res = await fetch(url, {
        cache: 'no-store',
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'x-admin-token': adminToken,
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        sessionStorage.removeItem('gracitas_admin_token');
        adminToken = '';
        showAuth('Token inválido o expirado.');
        throw new Error('Unauthorized');
      }
      return res;
    }

    function showAuth(msg = '') {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      livePill.classList.add('hidden');
      authSection.classList.remove('hidden');
      dashboardSection.classList.add('hidden');
      topControls.classList.add('hidden');
      if (msg) {
        authError.textContent = msg;
        authError.classList.remove('hidden');
      } else {
        authError.classList.add('hidden');
      }
    }

    function showDashboard() {
      authSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
      topControls.classList.remove('hidden');
      connectLiveEvents();
    }

    function formatLimaHour(iso) {
      return new Intl.DateTimeFormat('es-PE', {
        timeZone: 'America/Lima',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(new Date(iso));
    }

    async function loadOverview({ silent = false } = {}) {
      errorBanner.classList.add('hidden');
      if (!silent) {
        loadingState.classList.remove('hidden');
        courtsGrid.innerHTML = '';
      }

      try {
        const res = await apiFetch(`/admin/api/overview?date=${encodeURIComponent(dateInput.value)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error cargando datos');

        currentResources = data.resources;
        renderModalCourts(data.resources);
        renderKpis(data.resources, data.bookings);
        renderCourts(data.resources, data.bookings);
      } catch (err) {
        if (err.message !== 'Unauthorized') {
          errorText.textContent = err.message;
          errorBanner.classList.remove('hidden');
        }
      } finally {
        if (!silent) {
          loadingState.classList.add('hidden');
        }
      }
    }

    function renderModalCourts(resources) {
      modalCourt.innerHTML = '';
      for (const r of resources) {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.name;
        modalCourt.appendChild(opt);
      }
    }

    function renderKpis(resources, bookings) {
      const confirmed = bookings.filter((b) => b.status === 'confirmed');
      const cancelled = bookings.filter((b) => b.status === 'cancelled');
      const totalSlots = resources.reduce((acc, r) => acc + (r.close_hour - r.open_hour), 0);
      const bookedHours = confirmed.reduce((acc, b) => {
        return acc + Math.round((new Date(b.end_time) - new Date(b.start_time)) / 3600000);
      }, 0);
      const revenue = confirmed.reduce((acc, b) => acc + Number(b.total_price || 0), 0);

      document.getElementById('kpiCount').textContent = String(confirmed.length);
      document.getElementById('kpiOccupancy').textContent =
        totalSlots > 0 ? `${Math.round((bookedHours / totalSlots) * 100)}%` : '0%';
      document.getElementById('kpiRevenue').textContent = `S/ ${revenue.toFixed(2)}`;
      document.getElementById('kpiCancelled').textContent = String(cancelled.length);

      const breakdownEl = document.getElementById('courtBreakdown');
      breakdownEl.innerHTML = `<div style="font-weight:700;font-size:0.95rem;">Rendimiento por cancha</div>` +
        resources.map((r) => {
          const cap = Math.max(1, r.close_hour - r.open_hour);
          const rBookings = confirmed.filter((b) => b.resource_id === r.id);
          const rHours = rBookings.reduce((acc, b) => acc + Math.round((new Date(b.end_time) - new Date(b.start_time)) / 3600000), 0);
          const rRev = rBookings.reduce((acc, b) => acc + Number(b.total_price || 0), 0);
          const pct = Math.min(100, Math.round((rHours / cap) * 100));
          return `
            <div style="display:grid;gap:6px;">
              <div style="display:flex;justify-content:space-between;font-size:0.875rem;">
                <span style="font-weight:600;">${escapeHtml(r.name)}</span>
                <span class="tabular" style="color:var(--text-secondary);">${rHours}/${cap} h (${pct}%) · S/ ${rRev.toFixed(2)}</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderCourts(resources, bookings) {
      courtsGrid.innerHTML = '';
      if (!resources.length) {
        courtsGrid.innerHTML = `
          <div class="empty-state">
            <div style="font-weight:700;">No hay canchas activas configuradas</div>
            <div style="color:var(--text-secondary);font-size:0.9rem;">Verifica tus recursos en PostgreSQL y vuelve a actualizar.</div>
            <button class="btn-secondary" type="button" onclick="loadOverview()">Reintentar</button>
          </div>
        `;
        return;
      }
      const confirmed = bookings.filter((b) => b.status === 'confirmed');

      for (const court of resources) {
        const card = document.createElement('article');
        card.className = 'court-card';

        const header = document.createElement('div');
        header.className = 'court-header';
        header.innerHTML = `<span>${escapeHtml(court.name)}</span><span class="tabular" style="font-size:0.85rem;color:var(--text-secondary);">S/ ${Number(court.price_per_hour).toFixed(2)}/h</span>`;
        card.appendChild(header);

        const list = document.createElement('div');
        list.className = 'slot-list';

        for (let h = court.open_hour; h < court.close_hour; h++) {
          const slotStart = new Date(`${dateInput.value}T${String(h).padStart(2, '0')}:00:00-05:00`);
          const slotEnd = new Date(`${dateInput.value}T${String(h + 1).padStart(2, '0')}:00:00-05:00`);

          const match = confirmed.find((b) => {
            if (b.resource_id !== court.id) return false;
            const bs = new Date(b.start_time);
            const be = new Date(b.end_time);
            return bs < slotEnd && be > slotStart;
          });

          const row = document.createElement('div');
          row.className = 'slot-row';

          const label = `${String(h).padStart(2, '0')}:00 - ${String(h + 1).padStart(2, '0')}:00`;

          if (match) {
            row.innerHTML = `
              <div class="slot-meta">
                <div class="slot-time tabular">${label} <span class="badge badge-booked">Reservado</span></div>
                <div class="slot-detail">${escapeHtml(match.customer_name)} (${escapeHtml(match.customer_phone)}) · S/ ${Number(match.total_price).toFixed(2)}</div>
              </div>
              <button class="btn-danger" type="button" data-cancel="${escapeHtml(match.id)}">Cancelar</button>
            `;
          } else {
            row.innerHTML = `
              <div class="slot-meta">
                <div class="slot-time tabular">${label} <span class="badge badge-free">Libre</span></div>
                <div class="slot-detail">Disponible para reserva</div>
              </div>
              <button class="btn-secondary" type="button" data-book-court="${escapeHtml(court.id)}" data-book-hour="${h}">Reservar</button>
            `;
          }

          list.appendChild(row);
        }

        card.appendChild(list);
        courtsGrid.appendChild(card);
      }

      courtsGrid.querySelectorAll('[data-cancel]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-cancel');
          btn.disabled = true;
          await apiFetch(`/admin/api/bookings/${encodeURIComponent(id)}`, { method: 'DELETE' });
          await loadOverview();
        });
      });

      courtsGrid.querySelectorAll('[data-book-court]').forEach((btn) => {
        btn.addEventListener('click', () => {
          modalCourt.value = btn.getAttribute('data-book-court');
          document.getElementById('modalStartHour').value = btn.getAttribute('data-book-hour');
          document.getElementById('modalDuration').value = '1';
          modalError.classList.add('hidden');
          bookingDialog.showModal();
        });
      });
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      adminToken = tokenInput.value.trim();
      if (!adminToken) return;
      sessionStorage.setItem('gracitas_admin_token', adminToken);
      showDashboard();
      await loadOverview();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadOverview);
    document.getElementById('retryBtn').addEventListener('click', loadOverview);
    dateInput.addEventListener('change', loadOverview);

    document.getElementById('newBookingBtn').addEventListener('click', () => {
      modalError.classList.add('hidden');
      bookingDialog.showModal();
    });
    document.getElementById('closeDialogBtn').addEventListener('click', () => bookingDialog.close());

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      modalError.classList.add('hidden');

      const startHour = Number(document.getElementById('modalStartHour').value);
      const duration = Number(document.getElementById('modalDuration').value);
      const customerName = document.getElementById('modalName').value.trim();
      const customerPhone = document.getElementById('modalPhone').value.trim().replace(/^\+/, '');
      const endHour = startHour + duration;

      if (startHour < 15 || startHour > 22 || duration < 1 || duration > 4 || endHour > 23) {
        modalError.textContent = 'El horario debe estar dentro de 15:00 a 23:00 (máximo 4 horas).';
        modalError.classList.remove('hidden');
        return;
      }

      if (!/^\d{9,15}$/.test(customerPhone)) {
        modalError.textContent = 'Ingresa un celular válido de 9 a 15 dígitos (ej. 51999888777).';
        modalError.classList.remove('hidden');
        return;
      }

      const startTime = `${dateInput.value}T${String(startHour).padStart(2, '0')}:00:00-05:00`;
      const endTime = `${dateInput.value}T${String(endHour).padStart(2, '0')}:00:00-05:00`;

      try {
        const res = await apiFetch('/admin/api/bookings', {
          method: 'POST',
          body: JSON.stringify({
            resourceId: modalCourt.value,
            startTime,
            endTime,
            customerName,
            customerPhone,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'confirmed') {
          modalError.textContent = data.message || data.error || 'No se pudo crear la reserva.';
          modalError.classList.remove('hidden');
          return;
        }
        bookingDialog.close();
        document.getElementById('modalName').value = '';
        document.getElementById('modalPhone').value = '';
        await loadOverview();
      } catch (err) {
        modalError.textContent = err.message;
        modalError.classList.remove('hidden');
      }
    });

    setInterval(() => {
      if (adminToken && !document.hidden && !bookingDialog.open) {
        loadOverview({ silent: true });
      }
    }, 10000);

    if (adminToken) {
      showDashboard();
      loadOverview();
    } else {
      showAuth();
    }
  </script>
</body>
</html>
